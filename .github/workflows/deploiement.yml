# Construit le site et le publie sur GitHub Pages (https://zaderlyl.github.io/repolink/).
# Se lance à chaque push sur main, ou à la main depuis l'onglet « Actions ».
# Les données de l'accueil et de l'Explorer ne sont pas encore générées ici : le site utilise ses données de secours.
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits minimum pour publier sur Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; le plus récent remplace celui en cours
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
